<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="{{ '/' | relative_url }}" class="logo">
                <span class="logo-icon">🤖</span>
                <span class="logo-text">LocalAgents</span>
            </a>
            <ul class="nav-links">
                {% for item in site.navigation %}
                <li><a href="{{ item.url }}">{{ item.title }}</a></li>
                {% endfor %}
            </ul>
        </div>
    </nav>

    <main class="container page-content">
        {{ content }}
    </main>

    <footer>
        <div class="container">
            <p>LocalAgents &mdash; Apache-2.0 licensed. <a href="https://github.com/harshbhalodia/localagents">GitHub</a></p>
        </div>
    </footer>
</body>
</html>
