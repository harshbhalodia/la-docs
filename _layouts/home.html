<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="{{ '/' | relative_url }}" class="logo">
                <span class="logo-icon">🤖</span>
                <span class="logo-text">LocalAgents</span>
            </a>
            <ul class="nav-links">
                {% for item in site.navigation %}
                <li><a href="{{ item.url }}">{{ item.title }}</a></li>
                {% endfor %}
            </ul>
        </div>
    </nav>

    <div class="hero">
        <div class="container page-content home-content fade-in">
            {{ content }}
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; {{ site.time | date: "%Y" }} LocalAgents. Open Source &bull; Local-First.</p>
            <p style="margin-top: 0.5rem; font-size: 0.9rem;"><a href="https://github.com/harshbhalodia/localagents">GitHub</a></p>
        </div>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/terminal.js' | relative_url }}"></script>
</body>
</html>
